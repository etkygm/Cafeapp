<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
    }

    .item-price {
      color: #666;
      font-size: 14px;
      margin-top: 3px;
    }

    input[type="number"] {
      width: 65px;
      padding: 7px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    .total {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #333;
      text-align: right;
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Café Bill Calculator</h1>

    <div id="menu">
      <div class="status">Loading menu...</div>
    </div>

    <button id="calculateButton" onclick="calculateBill()" disabled>
      Calculate Bill
    </button>

    <div class="total">
      Total: $<span id="total">0.00</span>
    </div>
  </div>

  <script>
    let menuItems = [];

    async function loadMenu() {
      const menuContainer = document.getElementById("menu");
      const calculateButton = document.getElementById("calculateButton");

      try {
        const response = await fetch("menu.csv");

        if (!response.ok) {
          throw new Error("Could not load menu.csv");
        }

        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);

        // Skip the header row
        menuItems = lines.slice(1).map((line, index) => {
          const [name, price] = line.split(",");

          return {
            id: "item-" + index,
            name: name.trim(),
            price: parseFloat(price.trim())
          };
        }).filter(item =>
          item.name &&
          Number.isFinite(item.price)
        );

        displayMenu();
        calculateButton.disabled = false;

      } catch (error) {
        console.error(error);

        menuContainer.innerHTML = `
          <div class="status error">
            Unable to load the menu.
          </div>
        `;
      }
    }

    function displayMenu() {
      const menuContainer = document.getElementById("menu");

      menuContainer.innerHTML = "";

      menuItems.forEach(item => {
        const menuItem = document.createElement("div");
        menuItem.className = "menu-item";

        menuItem.innerHTML = `
          <div class="item-info">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-price">$${item.price.toFixed(2)}</div>
          </div>

          <input
            type="number"
            id="${item.id}"
            min="0"
            step="1"
            value="0"
            aria-label="Quantity for ${escapeHtml(item.name)}"
          >
        `;

        menuContainer.appendChild(menuItem);
      });
    }

    function getQuantity(id) {
      const quantity = parseInt(
        document.getElementById(id).value,
        10
      );

      return Number.isFinite(quantity) && quantity > 0
        ? quantity
        : 0;
    }

    function calculateBill() {
      let total = 0;

      menuItems.forEach(item => {
        total += getQuantity(item.id) * item.price;
      });

      document.getElementById("total").textContent =
        total.toFixed(2);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadMenu();
  </script>

</body>
</html>
